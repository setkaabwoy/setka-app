<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biographie - Setka</title>
  <style>
    html {
      background-color: #000000;
      min-height: 100%;
    }
    
    body {
      font-family: system-ui, sans-serif;
      background-color: #000000;
      background-image: url('./fond.png');
      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% auto;
      background-attachment: scroll;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      max-width: 650px;
      margin: 0 auto 20px auto;
    }
    
    .logo-svg {
      width: 240px;
      max-width: 80%;
      height: auto;
      margin-bottom: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.7));
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #334155;
      color: #ffffff;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }
    .back-btn:hover {
      background-color: #475569;
    }

    .bio-container {
      max-width: 800px;
      margin: 0 auto 30px auto;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }

    h1 {
      text-align: center;
      color: #f39c12;
      margin-bottom: 20px;
    }

    .bio-content {
      color: #ffffff;
      font-size: 1rem;
      line-height: 1.7;
    }

    .bio-content p {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn">⬅️ Retour à l'accueil</a>
    <img src="path2.svg" alt="Setka Logo" class="logo-svg">
  </div>

  <div class="bio-container">
    <h1>Biographie</h1>

    <div class="bio-content">
      <p>
        [Ajoute ton texte de présentation ici...]
      </p>
    </div>
  </div>

</body>
</html>
