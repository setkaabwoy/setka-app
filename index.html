<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Setka (setkaabwoy) | Musique indépendante Reggae, Dancehall & Hip-Hop</title>
  <meta name="description" content="Site officiel de Setka (setkaabwoy). Écoute et télécharge gratuitement les morceaux de musique indépendante Reggae, Dancehall et Hip-Hop.">
  <meta name="keywords" content="setka, setkaabwoy, musique setka, artiste indépendant, reggae france, dancehall fr, mp3 gratuit reggae">

  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="setka logo 2.svg">

  <!-- OPEN GRAPH -->
  <meta property="og:title" content="Setka (setkaabwoy) | Musique indépendante">
  <meta property="og:description" content="Écoute et télécharge gratuitement les morceaux de Setka.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://setkaabwoy.github.io/setka-app/index.html">
  <meta property="og:image" content="P1011408.jpg">

  <style>
    html {
      background-color: #000000;
      min-height: 100%;
    }

    body {
      font-family: system-ui, sans-serif;
      background-color: #000000;
      background-image: url('./fond.png');
      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% auto;
      background-attachment: scroll;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      text-align: center;
    }

    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 15px;
    }

    h1 {
      color: #f39c12;
      margin-top: 0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    p.subtitle {
      color: #d0d0d0;
      font-size: 1.05rem;
      margin-bottom: 25px;
    }

    /* LECTEUR AUDIO */
    .player-container {
      background: rgba(30, 30, 30, 0.9);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
    }

    select#audio-select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background-color: #111111;
      color: #ffffff;
      border: 1px solid #f39c12;
      font-size: 1rem;
      margin-bottom: 15px;
      cursor: pointer;
      outline: none;
    }

    select#audio-select option {
      background-color: #111111;
      color: #ffffff;
      padding: 8px;
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 8px;
    }

    /* NAV BUTTONS */
    .nav-btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #f39c12;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 25px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
    }

    .nav-btn:hover {
      background-color: #f1c40f;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="setka logo 2.svg" alt="Setka Logo" class="logo">
    <h1>Setka (setkaabwoy)</h1>
    <p class="subtitle">Musique indépendante — Reggae / Dancehall / Hip-Hop</p>

    <!-- LECTEUR AUDIO AVEC SÉLECTEUR -->
    <div class="player-container">
      <select id="audio-select" onchange="changeTrack(this.value)">
        <option value="https://setkamusic.s3.fr-par.scw.cloud/Setka%20-%20Jai%20pas%20vu%20lheure%20-%20Hill%20and%20Gully%20riddim%20%282026%29.mp3">Setka - Jai pas vu lheure - Hill and Gully riddim (2026)</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/Mirage%20-%20Setka%20%282023%29.mp3">Setka - Mirage (2023)</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/Setka%20-%20Musical%20buziness%20%282016%29.mp3">Setka - Musical buziness (2016)</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/Setka%20-%20Ghetto%20%282016%29.mp3">Setka - Ghetto (2016)</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/Setka%20-%20Policeman.mp3">Setka - Policeman</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/Setka%20-%20Remember.mp3">Setka - Remember</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/Setka%20-%20Vampayah%20buildings%20%282017%29.mp3">Setka - Vampayah buildings (2017)</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/Setka%20feat%20Makk%20Sense%C3%AE%20-%20Freestyle.mp3">Setka feat Makk Senseî - Freestyle</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/Setka%20freestyle%20SKD.mp3">Setka - Freestyle SKD</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/ChaB%20Piecito%20ft%20Osi%20C%20Town%20%26%20Setka%20-%20Long%20Road.mp3">ChaB Piecito ft Osi C Town & Setka - Long Road</option>
        <option value="https://setkamusic.s3.fr-par.scw.cloud/VAPS%20ft%20SETKA%20-%20Wine%20Pon%20Mi%20%282018%29.mp3">VAPS ft SETKA - Wine Pon Mi (2018)</option>
      </select>

      <audio id="main-player" controls preload="metadata">
        <source id="audio-source" src="https://setkamusic.s3.fr-par.scw.cloud/Setka%20-%20Jai%20pas%20vu%20lheure%20-%20Hill%20and%20Gully%20riddim%20%282026%29.mp3" type="audio/mpeg">
        Votre navigateur ne prend pas en charge le lecteur audio.
      </audio>
    </div>

    <div>
      <a href="telechargements.html" class="nav-btn">📥 Aller à la zone de téléchargement</a>
    </div>
  </div>

  <script>
    function changeTrack(url) {
      const player = document.getElementById('main-player');
      const source = document.getElementById('audio-source');
      
      source.src = url;
      player.load();
      player.play();
    }
  </script>
</body>
</html>
