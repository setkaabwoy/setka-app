<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecteur Audio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #38bdf8;
    }

    /* Player Card */
    .player-card {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      margin-bottom: 2rem;
      text-align: center;
    }

    .track-info {
      margin-bottom: 1rem;
    }

    .track-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
    }

    .track-artist {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    audio {
      width: 100%;
      margin-top: 1rem;
      outline: none;
    }

    .btn-download {
      margin-top: 1rem;
      padding: 0.65rem 1.2rem;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
      font-size: 0.95rem;
    }

    .btn-download:hover {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-download:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* Playlist */
    .playlist-title {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #cbd5e1;
    }

    .playlist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .playlist-item {
      background: #1e293b;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .playlist-item:hover {
      background: #334155;
    }

    .playlist-item.active {
      border-left: 4px solid #38bdf8;
      background: #334155;
    }

    .item-info .title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .item-info .artist {
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Mon Lecteur Audio</h1>

    <!-- Card Lecteur -->
    <div class="player-card">
      <div class="track-info">
        <div class="track-title" id="currentTitle">Sélectionnez une piste</div>
        <div class="track-artist" id="currentArtist">-</div>
      </div>

      <audio id="audioPlayer" controls></audio>

      <button id="downloadBtn" class="btn-download" disabled>
        📥 Télécharger ce morceau
      </button>
    </div>

    <!-- Playlist -->
    <div class="playlist-title">Playlist</div>
    <ul class="playlist" id="playlist"></ul>
  </div>

  <script>
    // 1. Liste de tes morceaux enregistrés sur Scaleway
    const tracks = [
      {
        title: "Piste 1",
        artist: "Artiste 1",
        url: "https://votre-bucket.s3.fr-par.scw.cloud/chanson1.mp3"
      },
      {
        title: "Piste 2",
        artist: "Artiste 2",
        url: "https://votre-bucket.s3.fr-par.scw.cloud/chanson2.mp3"
      }
    ];

    // Éléments du DOM
    const audioPlayer = document.getElementById('audioPlayer');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.getElementById('currentArtist');
    const downloadBtn = document.getElementById('downloadBtn');
    const playlistEl = document.getElementById('playlist');

    let currentTrack = null;

    // 2. Génération de la playlist HTML
    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.className = 'playlist-item';
      li.innerHTML = `
        <div class="item-info">
          <div class="title">${track.title}</div>
          <div class="artist">${track.artist}</div>
        </div>
      `;

      li.addEventListener('click', () => playTrack(index));
      playlistEl.appendChild(li);
    });

    // 3. Charger et jouer un morceau
    function playTrack(index) {
      currentTrack = tracks[index];

      // Mise à jour de l'affichage
      currentTitle.textContent = currentTrack.title;
      currentArtist.textContent = currentTrack.artist;
      audioPlayer.src = currentTrack.url;
      downloadBtn.disabled = false;

      // Gestion de la classe active dans la liste
      const items = playlistEl.querySelectorAll('.playlist-item');
      items.forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });

      audioPlayer.play();
    }

    // 4. Téléchargement direct en contournant le blocage CORS via le proxy
    downloadBtn.addEventListener('click', async () => {
      if (!currentTrack) return;

      const originalText = downloadBtn.textContent;
      downloadBtn.textContent = "⏳ Téléchargement en cours...";
      downloadBtn.disabled = true;

      // Utilisation du proxy CORS universel corsproxy.io
      const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(currentTrack.url);

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Erreur réseau");

        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `${currentTrack.artist} - ${currentTrack.title}.mp3`;
        document.body.appendChild(a);
        a.click();

        a.remove();
        window.URL.revokeObjectURL(blobUrl);
      } catch (err) {
        console.error("Erreur téléchargement :", err);
        // Lien de secours si le proxy ne répond pas
        const a = document.createElement('a');
        a.href = currentTrack.url;
        a.target = "_blank";
        a.download = `${currentTrack.artist} - ${currentTrack.title}.mp3`;
        a.click();
      } finally {
        downloadBtn.textContent = originalText;
        downloadBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
